<section class="services-container">
  <div class="container">
    <p class="eyebrow">What we do</p>
    <h1>Integrated solutions for long-term growth.</h1>
    <p class="intro-text">
      We provide dependable, practical services designed to support business
      development, construction excellence, and sustainable operations.
    </p>

    <div class="services-grid">
      <div class="service-card" *ngFor="let service of services">
        <img
          [src]="service.image"
          [alt]="service.title"
          class="service-image"
        />
        <div class="service-content">
          <h2>{{ service.title }}</h2>
          <p>{{ service.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
